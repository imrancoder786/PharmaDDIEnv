[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-interaction-gym"
version = "1.0.0"
description = "Pharmaceutical Drug Interaction RL Environment for OpenEnv"
requires-python = ">=3.11"
dependencies = [
    "openenv-core[core]>=0.2.2",
    "fastapi==0.115.0",
    "uvicorn==0.30.0",
    "pydantic>=2.7.0",
    "openai==1.40.0",
    "requests==2.32.3",
    "python-multipart==0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
server = "server.main:app"

[tool.setuptools]
include-package-data = true
packages = ["server"]
package-dir = { "" = "." }
